<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
   /*     body{
            background-color: black;
            color: white;
        }
*/
    </style>
</head>
<body>
    <p>Rock Paper Scissors</p>
    <button onclick="playerGame('Rock')">Rock</button>
    <button onclick="playerGame('Paper')">Paper</button>
    <button onclick="playerGame('Scissors')">Scissors</button>

    <p class="js-result"> </p>
    <p class="js-moves"> </p>
    
    <p class="js-score"></p>
    <button onclick="resetScores(); updateScoreElement();">Reset Scores</button>

    
    
<script>
    
    let scores=JSON.parse(localStorage.getItem('scores'))||
    {
        wins: 0,
        losses: 0,
        ties: 0   
    };

    /*
    this is another way to write the above code
    if(!scores){
        scores = {
            wins: 0,
            losses: 0,
            ties: 0
        };
    }
    
    if(scores!==null){
        scores = {
            wins: 0,
            losses: 0,
            ties: 0
    }
    */
    updateScoreElement();
    function resetScores(){
        scores.wins=0;
        scores.losses=0;
        scores.ties=0;
        localStorage.removeItem('scores');
     
    }
    console.log(scores)

    function pickComputerMove(){
        const randomNumber =Math.random();
        let computerChoice= ' ';
        if(randomNumber >= 0 && randomNumber < 1/3){
            //console.log('Rock');
            computerChoice = 'Rock';
        }
       else if(randomNumber >=1/3 && randomNumber < 2/3){
           // console.log('Paper');
           computerChoice = 'Paper';
        }
        else if(randomNumber >= 2/3 && randomNumber < 1){
            // console.log('Scissors');
            computerChoice = 'Scissors';
        }
            
        return computerChoice;
        }
    function playerGame(playerMove){
        const computerChoice = pickComputerMove();
        let result = ' ';
        if(playerMove === 'Rock'){
            if(computerChoice === 'Rock'){
                result = 'Tie';
            }
            else if(computerChoice === 'Paper'){
                result = 'You Lose';
            }
            else if(computerChoice === 'Scissors'){
                result = 'You Win';
            }
        }

        else if(playerMove === 'Paper'){
            if(computerChoice === 'Rock'){
                result = 'You Win';
            }
            else if(computerChoice === 'Paper'){
                result = 'Tie';
            }
            else if(computerChoice === 'Scissors'){
                result = 'You Lose';
            }
        }
        
        else if(playerMove === 'Scissors'){
            if(computerChoice === 'Rock'){
                result = 'You Lose';
            }
            else if(computerChoice === 'Paper'){
                result = 'You Win';
            }
            else if(computerChoice === 'Scissors'){
                result = 'Tie';
            }
        }

        if(result=='You Win'){
            scores.wins +=1;
        }
        else if(result=='You Lose'){
            scores.losses +=1;
        }
        else if(result=='Tie'){
            scores.ties +=1;
        }
        localStorage.setItem('scores', JSON.stringify(scores));
        updateScoreElement();

        //alert(`You picked ${playerMove}. Computer chose ${computerChoice}. Result: ${result}`);

        document.querySelector('.js-result').innerHTML = `Your Result: ${result}`;
        document.querySelector('.js-moves').innerHTML = `You picked ${playerMove}. Computer chose ${computerChoice}.`;
        console.log(playerMove);
        console.log(computerChoice);

    }

    function updateScoreElement(){
        document.querySelector('.js-score').innerHTML = `Wins: ${scores.wins}, Losses: ${scores.losses}, Ties: ${scores.ties}`;
    }

    
        
</script>
</body>
</html>
