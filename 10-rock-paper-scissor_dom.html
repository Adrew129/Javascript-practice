<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
    <style>
            
        body{
                background-color: black;
                color: white;
            }
     /*   .rock-sign{
            font-family: 'Noto Color Emoji', sans-serif;
            font-size: 50px;
        }

        */
        .rock-T,.paper-T,.scissor-T{
            border-radius: 60px;
            height: 100px;
            width: 100px;
            border-color: white;
            background-color: black;
        }
        .paper-sign,.rock-sign,.scissor-sign{
            font-family: 'Noto Color Emoji', sans-serif;
            font-size: 50px;

        }
        .game-card{
            /*display: flex; */
            align-items: center;
            position: relative;
            margin-left: 30%;
            margin-right: 30%;
            top:80px; 

        }
        .inside-card{
            margin-left: 60px;
        }
        .reset-btn{
            color: brown;
        }
    </style>
</head>
<body>
    <div class="game-card">
        <div class="inside-card">
            <p>Rock Paper Scissors</p>
            <button onclick="playerGame('Rock')" class="rock-T"><span class="rock-sign">&#9994;</span></button>
            <button onclick="playerGame('Paper')" class="paper-T"><span class="paper-sign">&#x270B;</span></button>
            <button onclick="playerGame('Scissors')" class="scissor-T"><span class="scissor-sign">&#x270C;</span></button>

            <p class="js-result"> </p>
            <p class="js-moves"> </p>
            
            <p class="js-score"></p>
            
            <button onclick="resetScores(); updateScoreElement();" class="reset-btn">Reset Scores</button>

            <p><span class="rock-sign"></span></p>
            <p><span class="paper-sign"></span></p>
            <p><span class="scissor-sign"></span></p>


        </div>
    </div>
    

    
    
<script>
    
    let scores=JSON.parse(localStorage.getItem('scores'))||
    {
        wins: 0,
        losses: 0,
        ties: 0   
    };

    /*
    this is another way to write the above code
    if(!scores){
        scores = {
            wins: 0,
            losses: 0,
            ties: 0
        };
    }
    
    if(scores!==null){
        scores = {
            wins: 0,
            losses: 0,
            ties: 0
    }
    */
    updateScoreElement();
    function resetScores(){
        scores.wins=0;
        scores.losses=0;
        scores.ties=0;
        localStorage.removeItem('scores');
     
    }
    console.log(scores)

    function pickComputerMove(){
        const randomNumber =Math.random();
        let computerChoice= ' ';
        if(randomNumber >= 0 && randomNumber < 1/3){
            //console.log('Rock');
            computerChoice = 'Rock';
        }
       else if(randomNumber >=1/3 && randomNumber < 2/3){
           // console.log('Paper');
           computerChoice = 'Paper';
        }
        else if(randomNumber >= 2/3 && randomNumber < 1){
            // console.log('Scissors');
            computerChoice = 'Scissors';
        }
            
        return computerChoice;
        }
    function playerGame(playerMove){
        const computerChoice = pickComputerMove();
        let result = ' ';
        if(playerMove === 'Rock'){
            if(computerChoice === 'Rock'){
                result = 'Tie';
            }
            else if(computerChoice === 'Paper'){
                result = 'You Lose';
            }
            else if(computerChoice === 'Scissors'){
                result = 'You Win';
            }
        }

        else if(playerMove === 'Paper'){
            if(computerChoice === 'Rock'){
                result = 'You Win';
            }
            else if(computerChoice === 'Paper'){
                result = 'Tie';
            }
            else if(computerChoice === 'Scissors'){
                result = 'You Lose';
            }
        }
        
        else if(playerMove === 'Scissors'){
            if(computerChoice === 'Rock'){
                result = 'You Lose';
            }
            else if(computerChoice === 'Paper'){
                result = 'You Win';
            }
            else if(computerChoice === 'Scissors'){
                result = 'Tie';
            }
        }

        if(result=='You Win'){
            scores.wins +=1;
        }
        else if(result=='You Lose'){
            scores.losses +=1;
        }
        else if(result=='Tie'){
            scores.ties +=1;
        }
        localStorage.setItem('scores', JSON.stringify(scores));
        updateScoreElement();

        //alert(`You picked ${playerMove}. Computer chose ${computerChoice}. Result: ${result}`);

        document.querySelector('.js-result').innerHTML = `Your Result: ${result}`;
        document.querySelector('.js-moves').innerHTML = `You picked ${playerMove}. Computer chose ${computerChoice}.`;
        console.log(playerMove);
        console.log(computerChoice);

    }

    function updateScoreElement(){
        document.querySelector('.js-score').innerHTML = `Wins: ${scores.wins}, Losses: ${scores.losses}, Ties: ${scores.ties}`;
    }

    
        
</script>
</body>
</html>
